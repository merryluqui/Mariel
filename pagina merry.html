<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<título>Erika Escalante | Portafolio Creativo</title>


<style>

:raíz {

--negro: #0e1113;

--dark: #15191c;

--gris: #73777c;

--blanco: #ffffff;

--soft-white: #f7f4f4;

--rosa: #B94EC2;

--rosa suave: #DCA7E1;

--luz rosa: #F5E7F7;

--coral: #B94EC2;

--vidrio: rgba(255,255,255,0.10);

--shadow: 0 24px 60px rgba(0,0,0,.24);

--radio: 28px;

--transición: todos .65s cubic-bezier(.16, 1, .3, 1);

--hero-bg-image: url("Estudio de grabación.jpg");

--about-bg-image: url("Estudio de grabación2.jpg");

--services-bg-image: url("Estudio de grabación3.jpg");

--experience-bg-image: url("Estudio de grabación2.jpg");

}


* {

margen: 0;

relleno: 0;

box-size: border-box;

}


html {

comportamiento de desplazamiento: suave;

}


cuerpo {

font-family: "Montserrat", "Poppins", Arial, sans-serif;

color: var(--black);

fondo: var(--soft-white);

desbordamiento-x: oculto;

}


a {

color: heredar;

decoración de texto: ninguna;

}


imagen, video {

ancho máximo: 100%;

mostrar: bloque;

}


botón {

familia de fuentes: heredar;

}


.sección {

posición: relativa;

relleno: 95px 8%;

desbordamiento: oculto;

}


.section-tag {

color: var(--rosa);

transformación de texto: mayúsculas;

espaciado entre letras: 6px;

tamaño de fuente: .78rem;

grosor de fuente: 800;

margen inferior: 16px;

}


.section-title {

tamaño de fuente: clamp(2rem, 4vw, 4.2rem);

interlineado: 1;

grosor de fuente: 900;

espaciado entre letras: -2px;

}


.section-title span,

.acento {

color: var(--rosa);

}


.btn {

borde: 0;

cursor: puntero;

relleno: 16px 28px;

radio de borde: 999px;

fondo: gradiente lineal (135 grados, var (--rosa), var (--coral));

color: blanco;

grosor de fuente: 800;

espaciado entre letras: 0,5px;

box-shadow: 0 16px 35px rgba(185, 78, 194, .32);

transición: var(--transición);

display: inline-flex;

alinear-elementos: centro;

espacio: 12px;

}


.btn:hover {

transformar: trasladarY(-4px) escala(1.03);

box-shadow: 0 24px 45px rgba(185, 78, 194, .45);

}


.btn-dark {

fondo: gradiente lineal(135deg, #15191c, #2a3035);

color: blanco;

box-shadow: 0 16px 35px rgba(0,0,0,.2);

}


/* CABECERA */


.encabezado {

posición: fija;

superior: 0;

ancho: 100%;

índice z: 1000;

relleno: 24px 7%;

pantalla: flexible;

alinear-elementos: centro;

justificar-contenido: espacio-entre;

color: blanco;

transición: var(--transición);

}


.header.scrolled {

relleno: 16px 7%;

fondo: rgba(10, 12, 14, .74);

filtro de fondo: desenfoque (18px);

box-shadow: 0 8px 30px rgba(0,0,0,.25);

}


.logo {

interlineado: .9;

font-family: Georgia, "Times New Roman", serif;

estilo de fuente: cursiva;

tamaño de fuente: 2,6rem;

grosor de fuente: 400;

}


.logo pequeño {

mostrar: bloque;

margen superior: 8px;

font-family: Montserrat, Arial, sans-serif;

tamaño de fuente: .65rem;

estilo de fuente: normal;

espaciado entre letras: 8px;

color: var(--pink-soft);

transformación de texto: mayúsculas;

}


.nav {

pantalla: flexible;

espacio: 34px;

alinear-elementos: centro;

tamaño de fuente: .78rem;

grosor de fuente: 700;

transformación de texto: mayúsculas;

}


.nav a {

posición: relativa;

opacidad: 0,92;

transición: var(--transición);

}


.nav a::after {

contenido: "";

posición: absoluta;

izquierda: 0;

parte inferior: -10px;

ancho: 0;

altura: 2px;

fondo: var(--rosa);

transición: var(--transición);

}


.nav a:hover,

.nav a.active {

color: var(--pink-soft);

}


.nav a:hover::after,

.nav a.active::after {

ancho: 100%;

}


.menu-toggle {

mostrar: ninguno;

fondo: transparente;

borde: 0;

color: blanco;

tamaño de fuente: 2rem;

}


/* HÉROE */


.héroe {

altura mínima: 100vh;

posición: relativa;

color: blanco;

pantalla: flexible;

alinear-elementos: centro;

relleno: 120px 7% 60px;

desbordamiento: oculto;

fondo: var(--negro);

}


.hero-bg {

posición: absoluta;

recuadro: 0;

fondo:

gradiente lineal(90 grados, rgba(8,10,12,.96) 0%, rgba(8,10,12,.70) 42%, rgba(8,10,12,.22) 100%),

var(--hero-bg-image) centro / cubierta no-repetir;

transformar: escala(1.04);

filtro: saturar(.8) contraste(1.05);

}


.hero-inner {

posición: relativa;

índice z: 2;

ancho: 100%;

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: 1fr 0,95fr;

alinear-elementos: fin;

espacio: 50px;

}


.hero-copy {

relleno inferior: 80px;

transición: var(--transición);

}


.hero-kicker {

color: var(--rosa);

grosor de fuente: 900;

espaciado entre letras: 8px;

transformación de texto: mayúsculas;

margen inferior: 14px;

}


.hero h1 {

ancho máximo: 720px;

tamaño de fuente: clamp(3.2rem, 8vw, 7.2rem);

interlineado: 0,88;

transformación de texto: mayúsculas;

espaciado entre letras: -5px;

grosor de fuente: 950;

margen inferior: 24px;

}


.hero h1 span {

color: var(--rosa);

}


.héroe p {

tamaño de fuente: 1rem;

interlineado: 1,65;

ancho máximo: 520px;

margen inferior: 28px;

}


.play-dot {

ancho: 42px;

altura: 42px;

visualización: cuadrícula en línea;

elementos de lugar: centro;

radio de borde: 50%;

fondo: blanco;

color: var(--rosa);

tamaño de fuente: 1,1rem;

}


.persona-heroica {

posición: relativa;

altura mínima: 78vh;

alinear-sí mismo: fin;

}


.persona-héroe img {

posición: absoluta;

parte inferior: -65px;

derecha: 0;

altura: min(780px, 86vh);

objeto-ajustar: contener;

posición del objeto: abajo a la derecha;

filtro: drop-shadow(0 30px 55px rgba(0,0,0,.5));

}


.social-rail {

posición: absoluta;

derecha: 7%;

superior: 38%;

índice z: 3;

pantalla: flexible;

flex-direction: columna;

espacio: 24px;

alinear-elementos: centro;

color: blanco;

grosor de fuente: 800;

opacidad: 0,9;

}



.social-rail a {

ancho: 36px;

altura: 36px;

mostrar: cuadrícula;

elementos de lugar: centro;

radio de borde: 50%;

color: blanco;

transición: var(--transición);

}


.social-rail a:hover {

color: var(--rosa);

fondo: rgba(185,78,194,.14);

transformar: trasladarY(-3px) escala(1.08);

}


.social-rail svg {

ancho: 20px;

altura: 20px;

relleno: coloractual;

}


.contact-link {

display: inline-flex;

alinear-elementos: centro;

espacio: 10px;

color: rgba(255,255,255,.88);

transición: var(--transición);

ancho: ajustar-contenido;

}


.contact-link:hover {

color: var(--rosa);

transformar: translateX(5px);

}


.contact-link svg {

ancho: 20px;

altura: 20px;

relleno: coloractual;

flex: 0 0 automático;

}


.social-rail::after {

contenido: "";

ancho: 1px;

altura: 160px;

fondo: rgba(255,255,255,.55);

margen superior: 8px;

}


.scroll-indicator {

posición: absoluta;

parte inferior: 44px;

izquierda: 7%;

índice z: 4;

ancho: 32px;

altura: 54px;

borde: 1px sólido rgba(255,255,255,.6);

radio de borde: 999px;

}


.scroll-indicator::after {

contenido: "";

posición: absoluta;

superior: 10px;

izquierda: 50%;

ancho: 4px;

altura: 8px;

transformar: trasladarX(-50%);

radio de borde: 999px;

fondo: blanco;

animación: scrollDot 1.8s infinito;

}


@keyframes scrollDot {

0% { opacidad: 0; transformar: traducir(-50%, 0); }

35% { opacidad: 1; }

100% { opacidad: 0; transformar: traducir(-50%, 20px); }

}



.acciones-de-héroe {

pantalla: flexible;

alinear-elementos: centro;

espacio: 16px;

flex-wrap: envoltura;

}


.btn-cv {

fondo: rgba(255,255,255,.10);

color: blanco;

borde: 1px sólido rgba(255,255,255,.36);

sombra de caja: ninguna;

filtro de fondo: desenfoque (12px);

}


.btn-cv:hover {

fondo: rgba(255,255,255,.18);

color del borde: var(--rosa-suave);

box-shadow: 0 18px 40px rgba(0,0,0,.20);

}


/* SUPERPOSICIÓN DE VÍDEO */


.video-overlay {

posición: fija;

recuadro: 0;

índice z: 5000;

fondo: rgba(8,10,12,.94);

opacidad: 0;

eventos de puntero: ninguno;

transición: var(--transición);

}


.video-overlay.active {

opacidad: 1;

eventos de puntero: automático;

}


.video-overlay {

mostrar: cuadrícula;

elementos de lugar: centro;

relleno: 24px;

}


.youtube-frame-wrap {

ancho: min(430px, 92vw);

relación de aspecto: 9 / 16;

altura máxima: 90vh;

radio de borde: 24px;

desbordamiento: oculto;

fondo: #000;

box-shadow: 0 30px 90px rgba(0,0,0,.55);

}


.youtube-frame-wrap iframe {

ancho: 100%;

altura: 100%;

borde: 0;

mostrar: bloque;

}


.close-video {

posición: fija;

superior: 30px;

derecha: 36px;

Índice z: 5100;

ancho: 52px;

altura: 52px;

borde: 1px sólido rgba(255,255,255,.4);

fondo: rgba(255,255,255,.1);

color: blanco;

radio de borde: 50%;

tamaño de fuente: 2rem;

cursor: puntero;

filtro de fondo: desenfoque (10px);

transición: var(--transición);

}


.close-video:hover {

fondo: var(--rosa);

transformar: rotar(90 grados);

}


.hero.is-playing .hero-copy,

.hero.está-jugando .persona-heroica,

.hero.is-playing .social-rail,

.hero.is-playing .scroll-indicator {

opacidad: 0;

filtro: desenfoque(10px);

transformar: escala(.98);

}


/* SOBRE MÍ */


.acerca de {

fondo:

gradiente-lineal(rgba(255,255,255,.88), rgba(255,255,255,.9)),

var(--about-bg-image) centro / cubrir sin repetir;

}


.about-grid {

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: .9fr 1.15fr;

espacio: 70px;

alinear-elementos: centro;

}


.sobre p {

color: #3d4146;

interlineado: 1,8;

margen: 24px 0 32px;

ancho máximo: 620px;

}


.tarjetas-de-habilidades {

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: repetir(3, 1fr);

espacio: 24px;

}


.tarjeta-de-habilidad {

altura mínima: 250px;

radio-borde: var(--radio);

desbordamiento: oculto;

fondo: blanco;

box-shadow: 0 20px 50px rgba(0,0,0,.08);

posición: relativa;

transición: var(--transición);

}


.skill-card:hover {

transformar: translateY(-14px);

box-shadow: 0 32px 70px rgba(185,78,194,.18);

}


.skill-card img {

ancho: 100%;

altura: 190px;

ajuste del objeto: cubrir;

posición del objeto: centro;

filtro: saturar(.9);

transición: var(--transición);

}


.skill-card:hover img {

transformar: escala(1.08);

}


.tarjeta-de-habilidad h3 {

alineación de texto: centro;

relleno: 20px 10px;

tamaño de fuente: .88rem;

transformación de texto: mayúsculas;

espaciado entre letras: 0,7px;

}


.icono-burbuja {

posición: absoluta;

izquierda: 50%;

parte inferior: 48px;

transformar: trasladarX(-50%);

ancho: 58px;

altura: 58px;

radio de borde: 50%;

fondo: rgba(255,255,255,.9);

mostrar: cuadrícula;

elementos de lugar: centro;

color: var(--rosa);

tamaño de fuente: 1,7rem;

box-shadow: 0 15px 30px rgba(0,0,0,.1);

borde: 1px sólido rgba(185,78,194,.25);

}


/* PORTAFOLIO */


.portfolio {

fondo: degradado radial(círculo en la parte superior derecha, rgba(185,78,194,.18), transparente 34%), var(--negro);

color: blanco;

relleno izquierdo: 6%;

relleno derecho: 6%;

}


.portfolio-head {

pantalla: flexible;

justificar-contenido: espacio-entre;

espacio: 24px;

alinear-elementos: fin;

margen inferior: 40px;

}


.portfolio-carrusel {

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: 44px 1fr 44px;

alinear-elementos: centro;

espacio: 16px;

}


.portfolio-track {

pantalla: flexible;

espacio: 28px;

desbordamiento-x: automático;

comportamiento de desplazamiento: suave;

relleno: 10px 4px 24px;

ancho de la barra de desplazamiento: ninguno;

}


.portfolio-track::-webkit-scrollbar {

mostrar: ninguno;

}


.portfolio-card {

flex: 0 0 230px;

radio de borde: 22px;

desbordamiento: oculto;

posición: relativa;

fondo: #222;

altura mínima: 290px;

box-shadow: 0 20px 50px rgba(0,0,0,.28);

transición: var(--transición);

}


.portfolio-card:hover {

transformar: trasladarY(-12px) escala(1.02);

}


Vídeo de la tarjeta del portafolio,

.portfolio-card img {

ancho: 100%;

altura: 290px;

ajuste del objeto: cubrir;

transición: var(--transición);

}


.portfolio-card:hover video,

.portfolio-card:hover img {

transformar: escala(1.08);

filtro: brillo(.65);

}


.juego-de-tarjetas {

posición: absoluta;

recuadro: 0;

mostrar: cuadrícula;

elementos de lugar: centro;

fondo: gradiente lineal (hacia arriba, rgba(0,0,0,.75), transparente 55%);

opacidad: 0,95;

}


.juego-de-tarjetas span {

ancho: 54px;

altura: 54px;

fondo: blanco;

color: var(--rosa);

radio de borde: 50%;

mostrar: cuadrícula;

elementos de lugar: centro;

grosor de fuente: 900;

}


.portfolio-label {

posición: absoluta;

izquierda: 16px;

derecha: 16px;

parte inferior: 14px;

tamaño de fuente: .68rem;

grosor de fuente: 800;

transformación de texto: mayúsculas;

espaciado entre letras: 0,6px;

color: blanco;

}


.flecha {

ancho: 44px;

altura: 44px;

radio de borde: 50%;

borde: 1px sólido rgba(255,255,255,.25);

fondo: rgba(255,255,255,.08);

color: blanco;

cursor: puntero;

tamaño de fuente: 1,5rem;

transición: var(--transición);

}


.arrow:hover {

fondo: var(--rosa);

transformar: escala(1.1);

}


/* SERVICIOS */


.servicios {

fondo:

gradiente-lineal(rgba(255,255,255,.86), rgba(255,255,255,.9)),

var(--services-bg-image) centro / cubrir sin repetir;

}


.fila-servicios {

margen superior: 52px;

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: repetir(5, 1fr);

espacio: 22px;

}


.tarjeta-de-servicio {

fondo: rgba(255,255,255,.72);

borde: 1px sólido rgba(185,78,194,.16);

radio de borde: 24px;

relleno: 38px 22px;

alineación de texto: centro;

filtro de fondo: desenfoque(8px);

transición: var(--transición);

}


.service-card:hover {

transformar: translateY(-12px);

box-shadow: 0 30px 60px rgba(185,78,194,.18);

fondo: blanco;

}


.service-icon {

color: var(--rosa);

tamaño de fuente: 2,4rem;

margen inferior: 18px;

}


.service-card h3 {

transformación de texto: mayúsculas;

tamaño de fuente: .86rem;

margen inferior: 14px;

}


.service-card p {

color: #4d5359;

tamaño de fuente: .85rem;

interlineado: 1,7;

}


/* EXPERIENCIA */


.experiencia {

color: blanco;

fondo:

gradiente-lineal(90 grados, rgba(14,17,19,.88), rgba(14,17,19,.62)),

var(--experience-bg-image) centro / cubierta sin repetición;

relleno superior: 78px;

relleno inferior: 78px;

}


.experience-grid {

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: .8fr 1.2fr;

espacio: 50px;

alinear-elementos: centro;

}


.logos {

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: repetir(5, 1fr);

espacio: 18px;

alinear-elementos: centro;

}


.logo-card {

altura mínima: 118px;

radio de borde: 22px;

fondo: rgba(255,255,255,.92);

borde: 1px sólido rgba(255,255,255,.18);

filtro de fondo: desenfoque(14px);

mostrar: cuadrícula;

elementos de lugar: centro;

relleno: 20px;

transición: var(--transición);

grosor de fuente: 900;

alineación de texto: centro;

espaciado entre letras: 1px;

transformación de texto: mayúsculas;

color: var(--black);

opacidad: 1;

}


.logo-card:hover {

transformar: translateY(-10px);

fondo: #ffffff;

box-shadow: 0 24px 55px rgba(0,0,0,.22);

}


.logo-card img {

ancho: 100%;

ancho máximo: 145px;

altura máxima: 70px;

objeto-ajustar: contener;

filtro: ninguno;

opacidad: 1;

fondo: transparente;

}


/* CONTACTO */


.contacto {

fondo: var(--negro);

color: blanco;

relleno superior: 70px;

relleno inferior: 70px;

}


.contact-box {

radio de borde: 30px;

borde: 1px sólido rgba(255,255,255,.14);

fondo: gradiente lineal(135 grados, rgba(255,255,255,.08), rgba(255,255,255,.03));

mostrar: cuadrícula;

columnas-de-plantilla-de-cuadrícula: 1fr 1.4fr 1fr;

espacio: 34px;

relleno: 42px;

alinear-elementos: centro;

filtro de fondo: desenfoque(14px);

}


.contact-items {

mostrar: cuadrícula;

espacio: 16px;

color: rgba(255,255,255,.85);

}


.contact-items p {

pantalla: flexible;

espacio: 12px;

alinear-elementos: centro;

}


pie de página {

fondo: gradiente lineal(90 grados, #82388A, #B94EC2);

color: blanco;

relleno: 18px 7%;

pantalla: flexible;

justificar-contenido: espacio-entre;

tamaño de fuente: .78rem;

}


/* ANIMACIONES */


.revelar {

opacidad: 0;

transformar: translateY(50px);

filtro: desenfoque(8px);

transición: opacidad .9s cúbica-bezier(.16,1,.3,1),

transformar .9s cúbico-bezier(.16,1,.3,1),

filtro .9s cubic-bezier(.16,1,.3,1);

retardo de transición: var(--retardo, 0s);

}


.revelar.mostrar {

opacidad: 1;

transformar: translateY(0);

filtro: desenfoque(0);

}


.revelar-izquierda {

transformar: translateX(-60px);

}


.revelar-derecha {

transformar: translateX(60px);

}


.reveal-zoom {

transformar: escala(.92);

}


.reveal-left.show,

.revelar-derecha.mostrar,

.reveal-zoom.show {

transformar: trasladarX(0) escalar(1);

}



.portfolio-modal {

posición: fija;

recuadro: 0;

índice z: 2000;

fondo: rgba(7,9,11,.92);

filtro de fondo: desenfoque (18px);

mostrar: cuadrícula;

elementos de lugar: centro;

opacidad: 0;

eventos de puntero: ninguno;

transición: var(--transición);

relleno: 40px;

}


.portfolio-modal.active {

opacidad: 1;

eventos de puntero: automático;

}


.portfolio-modal img {

ancho máximo: min(1100px, 92vw);

altura máxima: 86vh;

objeto-ajustar: contener;

radio de borde: 24px;

box-shadow: 0 30px 80px rgba(0,0,0,.45);

transformar: escala(.94);

transición: var(--transición);

}


.portfolio-modal.active img {

transformar: escala(1);

}


.portfolio-modal-close {

posición: fija;

superior: 28px;

derecha: 34px;

ancho: 54px;

altura: 54px;

radio de borde: 50%;

borde: 1px sólido rgba(255,255,255,.25);

fondo: rgba(255,255,255,.09);

color: blanco;

tamaño de fuente: 2rem;

cursor: puntero;

Índice z: 2001;

}



.logo-fallback {

color: #1a1d20;

grosor de fuente: 900;

tamaño de fuente: .9rem;

espaciado entre letras: 0,8px;

alineación de texto: centro;

transformación de texto: mayúsculas;

}



.gallery-overlay {

posición: fija;

recuadro: 0;

índice z: 6000;

fondo: rgba(7,9,11,.94);

filtro de fondo: desenfoque (18px);
